<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiber Optic Fault Finder: Simulasi Uji OTDR</title>
<meta name="description" content="Lab Maya simulasi OTDR untuk mendeteksi kerusakan kabel fiber optik (Fase F TKJ).">
<style>:root{
  --navy:#0B1E3F; --navy2:#102a55; --biru:#1565C0; --biru2:#1e88e5; --cyan:#00C2FF; --abu:#263238; --abu2:#546E7A;
  --terang:#ECEFF1; --putih:#fff; --trace:#FFD54F; --hijau:#2E7D32; --hijau2:#43A047; --merah:#D32F2F; --kuning:#F9A825;
  --ungu:#6A1B9A; --kartu:#f5f9fd; --garis:#d5e2ee; --teks:#18232f; --teks2:#4d5b69;
  --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040b17;overflow:hidden;font-family:var(--font);color:var(--teks);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
.opt:disabled,.chipset button:disabled,.oslot:disabled{opacity:1;cursor:default}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;
  background:linear-gradient(180deg,#eef4fa 0%,#e3edf7 100%);box-shadow:0 0 0 1px #0a1730,0 20px 60px rgba(0,0,0,.6)}
/* ---------- Topbar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(90deg,var(--navy) 0%,#0f2d5c 100%);color:#fff;z-index:20}
#topbar.clear{background:transparent}
.tb-btn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;padding:0}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn svg{width:22px;height:22px}
.tb-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-title b{font-size:16px;letter-spacing:.2px}
.tb-title span{font-size:13px;color:#9fc3e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.tb-mid{flex:1;display:flex;justify-content:center}
.tb-right{display:flex;gap:8px}
.stepper{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:4px 12px 4px 6px}
.stepper .st{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#9fb6cf;font-size:13px;padding:4px 8px;border-radius:16px}
.stepper .st i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;background:rgba(255,255,255,.12);color:#fff}
.stepper .st.done i{background:var(--hijau2)}
.stepper .st.now{background:rgba(0,194,255,.18);color:#fff}
.stepper .st.now i{background:var(--cyan);color:#06213f}
.stepper .st:disabled{opacity:.5}
.stepper .lbl{font-size:13px;color:#cfe6ff;margin-left:6px;white-space:nowrap}
.progress-pill{display:flex;align-items:center;gap:10px;font-size:13px;color:#cfe6ff}
.progress-pill .bar{width:220px;height:8px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#7cf0ff)}
/* ---------- View ---------- */
#view{position:absolute;left:0;right:0;top:60px;bottom:0;overflow:hidden}
#view.L01{top:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 24px 0}
.screen-main{flex:1;min-height:0;display:flex;gap:18px}
.foot{height:62px;flex:none;display:flex;align-items:center;gap:12px;border-top:1px solid var(--garis);margin:0 -24px;padding:0 24px;background:rgba(255,255,255,.65)}
.foot .grow{flex:1}
.foot .ai-note{font-size:12px;color:var(--teks2)}
h1,h2,h3{margin:0}
h2.title{font-size:24px;color:var(--navy);display:flex;align-items:center;gap:10px}
h2.title small{font-size:14px;color:var(--teks2);font-weight:500}
.lead{font-size:16px;color:var(--teks2);margin:4px 0 12px}
p{margin:0 0 8px;line-height:1.5}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;font-weight:700;font-size:16px;line-height:1.1;transition:transform .08s, box-shadow .15s}
.btn svg{width:20px;height:20px}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,40,80,.18)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.primary{background:var(--kuning);color:#1c1300}
.btn.blue{background:var(--biru);color:#fff}
.btn.green{background:var(--hijau);color:#fff}
.btn.red{background:var(--merah);color:#fff}
.btn.purple{background:var(--ungu);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #b9cde1}
.btn.big{min-height:54px;font-size:19px;padding:0 28px;border-radius:12px}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px}
.btn.wide{width:100%}
/* ---------- Cards / panels ---------- */
.card{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(16,42,85,.05)}
.panel-dark{background:linear-gradient(180deg,#0d2347,#0a1b38);color:#e8f2ff;border-radius:14px;padding:14px;border:1px solid #1c3a6b}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;background:#e3f2fd;color:var(--biru)}
.badge.ok{background:#e8f5e9;color:var(--hijau)}
.badge.bad{background:#ffebee;color:var(--merah)}
.badge.warn{background:#fff8e1;color:#9a6b00}
.badge.gray{background:#eceff1;color:#455a64}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.45;border:1px solid transparent}
.fb.ok{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
.fb.bad{background:#ffebee;border-color:#ef9a9a;color:#8e1b1b}
.fb.warn{background:#fff8e1;border-color:#ffe082;color:#6d4c00}
.fb.info{background:#e3f2fd;border-color:#90caf9;color:#0d3c73}
.fb b{display:block;margin-bottom:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:9px;border:1.5px solid #b9cde1;background:#fff;color:var(--navy);font-weight:600;font-size:15px}
.seg button.on{background:var(--biru);border-color:var(--biru);color:#fff}
.seg.dark button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#d9ecff}
.seg.dark button.on{background:var(--cyan);border-color:var(--cyan);color:#05213f}
.label{font-size:13px;font-weight:700;color:var(--teks2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.panel-dark .label{color:#8fb3d9}
.muted{color:var(--teks2)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
/* ---------- Plot ---------- */
.plot{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.plot-bg{fill:#081631}
.plot .grid{stroke:rgba(160,200,255,.18);stroke-width:1}
.plot .grid.minor{stroke:rgba(160,200,255,.08)}
.plot .tick{fill:#9db7d6;font-size:12px}
.plot .axis-label{fill:#9db7d6;font-size:12px;font-weight:600}
.plot .band{fill:rgba(0,194,255,.14)}
.plot .band.bad{fill:rgba(239,83,80,.18)}
.plot .marker line{stroke:#ff5252;stroke-width:2;stroke-dasharray:5 4}
.plot .marker text{fill:#ffcdd2;font-size:13px;font-weight:700}
.plot .marker.ok line{stroke:#69f0ae}
.plot .marker.ok text{fill:#b9f6ca}
.plot .marker.user line{stroke:#80d8ff}
.plot .marker.user text{fill:#b3e5fc}
.plot .cursor line{stroke:var(--cyan);stroke-width:2}
.plot .cursor rect{fill:var(--cyan)}
.plot .cursor text{fill:#03223f;font-size:10px;font-weight:800}
.plot .plot-hit{fill:transparent;cursor:ew-resize;touch-action:none}
.plot .hotspot{cursor:pointer}
.plot .hotspot circle{fill:var(--kuning);stroke:#fff;stroke-width:2}
.plot .hotspot text{fill:#1c1300;font-size:13px;font-weight:800;pointer-events:none}
.plot .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.plot-holder{position:relative;border-radius:12px}
.plot-holder:focus-visible{outline:3px solid var(--cyan)}
.readout{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums}
.readout .v{font-size:22px;font-weight:800;color:var(--cyan)}
.legend{display:flex;gap:14px;font-size:13px;color:#cfe3fa;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* ---------- Tables ---------- */
table.ev{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.ev th{text-align:left;font-size:12px;color:#8fb3d9;font-weight:700;padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.15)}
table.ev td{white-space:nowrap;padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:#e3efff}
table.ev td .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
table.light th{color:var(--teks2);border-bottom:1px solid var(--garis)}
table.light td{color:var(--teks);border-bottom:1px solid #eef3f8}
/* ---------- Modal / toast ---------- */
#modal{position:absolute;inset:0;background:rgba(4,12,26,.62);display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
#modal .box{width:640px;max-height:620px;overflow:auto;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#modal .box h3{font-size:21px;color:var(--navy);margin-bottom:10px;display:flex;gap:8px;align-items:center}
#modal .box .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
#toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--abu);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:760px;text-align:center}
#toast.show{opacity:1}
#rotate-hint{position:fixed;left:8px;right:8px;bottom:8px;background:#0b1e3f;color:#fff;border-radius:12px;padding:10px 12px;font:14px var(--font);display:none;z-index:99;align-items:center;gap:10px}
#rotate-hint.show{display:flex}
#rotate-hint button{background:var(--kuning);border:0;border-radius:8px;padding:6px 10px;font-weight:700}
/* ---------- L01 ---------- */
.L01 .screen{padding:0;background:radial-gradient(1200px 600px at 75% 30%,#173f7d 0%,#0b1e3f 55%,#060f22 100%);color:#fff}
.hero-wrap{position:absolute;inset:0}
.hero-lines{position:absolute;inset:0;width:100%;height:100%}
.hero-lines path{fill:none;stroke-linecap:round}
.hero-lines .glow{stroke-dasharray:60 900;animation:flow 4s linear infinite}
@keyframes flow{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
.hero-img{position:absolute;left:46px;top:100px;width:380px;height:346px;border-radius:24px;overflow:hidden;border:2px solid rgba(0,194,255,.35);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-text{position:absolute;left:470px;top:96px;right:40px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#00a6e0,#1565C0);border-radius:12px;padding:6px 16px;font-weight:800;font-size:18px}
.hero-text h1{font-size:68px;line-height:1.02;margin:14px 0 10px;font-weight:900;font-style:italic;letter-spacing:-.5px;
  background:linear-gradient(180deg,#fff 30%,#9fe8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero-text .sub{font-size:24px;color:#d6ecff;margin:0 0 22px;max-width:640px;line-height:1.3}
.hero-meta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero-meta span{font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;color:#cfe6ff}
.hero-menu{position:absolute;left:46px;right:46px;bottom:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.hero-menu button{height:84px;border-radius:14px;border:1px solid rgba(0,194,255,.35);background:rgba(10,32,70,.8);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px}
.hero-menu button:hover{background:rgba(21,101,192,.85)}
.hero-menu svg{width:30px;height:30px;color:var(--cyan)}
/* ---------- generic grids ---------- */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ticket{position:relative;text-align:left;border:1.5px solid var(--garis);background:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.ticket:hover{border-color:#90caf9}
.ticket.sel{border-color:var(--biru);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
.ticket .code{font-size:26px;font-weight:900;color:var(--navy)}
.ticket .gej{font-size:14px;color:var(--teks2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:#f9a825;font-size:16px;letter-spacing:1px}
.stars .off{color:#cfd8dc}
.typecard{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--garis);background:#fff;border-radius:12px;padding:8px;font-size:15px;font-weight:700;color:var(--navy)}
.typecard img{width:96px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.typecard.on{border-color:var(--biru);background:#e3f2fd}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--garis);background:#fff;border-radius:10px;padding:8px 10px;font-size:14.5px;color:var(--teks)}
.chk .box{width:20px;height:20px;border-radius:5px;border:2px solid #90a4ae;flex:none;display:grid;place-items:center;margin-top:1px}
.chk.on{border-color:var(--biru);background:#e3f2fd}
.chk.on .box{background:var(--biru);border-color:var(--biru)}
.chk.on .box::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk.right{border-color:var(--hijau2);background:#e8f5e9}
.chk.wrong{border-color:#e57373;background:#ffebee}
/* L04 */
.alat-card{position:relative;border:1.5px solid var(--garis);background:linear-gradient(180deg,#f3f8fe,#e6f0fb);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:var(--navy);font-size:15px}
.alat-card .im{height:110px;width:100%;display:flex;align-items:center;justify-content:center}
.alat-card .im img{max-height:110px;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.alat-card.on{border-color:var(--biru);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
.alat-card .ping{position:absolute;right:10px;top:10px;width:16px;height:16px;border-radius:50%;background:var(--cyan)}
.alat-card .ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--cyan);animation:ping 1.4s ease-out infinite}
.alat-card .seen{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--hijau2);color:#fff;display:grid;place-items:center}
.alat-card .seen svg{width:14px;height:14px}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.tool-chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--garis);background:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;color:var(--navy)}
.tool-chip img{width:58px;height:40px;object-fit:contain;mix-blend-mode:multiply}
.tool-chip.on{border-color:var(--biru);background:#e3f2fd}
.svgimg{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;max-height:110px}
.svgimg svg{width:100%;height:100%;max-height:110px}
.tray .item .svgimg{height:92px;width:140px}
.slot .svgimg{height:88px;width:128px}
.tool-chip .svgimg{width:58px;height:40px}
.act .svgimg{height:46px;width:80px}
/* L05 */
.chain{display:flex;align-items:center;gap:0;padding:14px;background:linear-gradient(180deg,#0d2347,#0a1b38);border-radius:16px}
.slot{width:150px;height:150px;border:2.5px dashed #5d8fc4;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9fc3e8;font-size:14px;font-weight:700;text-align:center;gap:4px;background:rgba(255,255,255,.03);flex:none}
.slot.hover,.slot.armed{border-color:var(--cyan);background:rgba(0,194,255,.12)}
.slot.filled{border-style:solid;border-color:#43a047;background:#f3f8fe;color:var(--navy)}
.slot.filled img{max-width:128px;max-height:90px;object-fit:contain;mix-blend-mode:multiply}
.wire{height:6px;flex:1;min-width:14px;background:#33496b;border-radius:3px;position:relative;overflow:hidden}
.wire.lit{background:#f6c343}
.wire.lit::after{content:"";position:absolute;top:0;bottom:0;width:40px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:sweep 1.2s linear infinite}
@keyframes sweep{from{left:-40px}to{left:100%}}
.tray{display:flex;gap:14px;justify-content:center}
.tray .item{width:170px;height:150px;border:1.5px solid var(--garis);border-radius:14px;background:linear-gradient(180deg,#f3f8fe,#e6f0fb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;color:var(--navy);touch-action:none;user-select:none}
.tray .item img{max-width:140px;max-height:92px;object-fit:contain;mix-blend-mode:multiply;pointer-events:none}
.tray .item.sel{border-color:var(--biru);box-shadow:0 0 0 3px rgba(21,101,192,.25)}
.tray .item.used{visibility:hidden}
.drag-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.9;transform-origin:0 0;margin:0}
/* L10 */
.act{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--garis);background:#fff;border-radius:14px;padding:10px 12px;min-height:128px}
.act .t{font-weight:800;color:var(--navy);font-size:16px;line-height:1.25}
.act .a{font-size:13px;color:var(--teks2)}
.act img{height:46px;width:auto;object-fit:contain;mix-blend-mode:multiply;align-self:flex-start}
.act.on{border-color:var(--biru);background:#e3f2fd}
.act .k{position:absolute}
.slots{display:flex;flex-direction:column;gap:8px}
.oslot{display:flex;align-items:center;gap:10px;min-height:46px;border:2px dashed #b0c4d8;border-radius:10px;padding:6px 10px;font-size:14.5px;background:#fafcfe;text-align:left;width:100%}
.oslot i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.oslot.full{border-style:solid;border-color:#90caf9;background:#e3f2fd}
.oslot.wrong{border-color:#e57373;background:#ffebee}
.oslot.right{border-color:#66bb6a;background:#e8f5e9}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border:1.5px solid #90caf9;background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;color:var(--navy);font-weight:600;max-width:100%}
.pbar{height:10px;border-radius:6px;background:#dfe9f3;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--biru),var(--cyan));transition:width .25s}
/* L13 */
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--garis);background:#fff;border-radius:12px;padding:10px 14px;font-size:16px;color:var(--teks)}
.opt b{width:30px;height:30px;border-radius:50%;background:#e3f2fd;color:var(--biru);display:grid;place-items:center;flex:none}
.opt.on{border-color:var(--biru);background:#e3f2fd}
.opt.right{border-color:var(--hijau2);background:#e8f5e9}
.opt.right b{background:var(--hijau2);color:#fff}
.opt.wrong{border-color:#e57373;background:#ffebee}
.opt.wrong b{background:var(--merah);color:#fff}
textarea{width:100%;font:15px var(--font);border:1.5px solid #b9cde1;border-radius:10px;padding:8px 10px;resize:none}
.chipset{display:flex;gap:5px;flex-wrap:wrap}
.chipset button{border:1.5px solid #b9cde1;background:#fff;border-radius:16px;padding:4px 9px;font-size:12.5px;font-weight:700;color:var(--navy)}
.chipset button.on{background:var(--biru);border-color:var(--biru);color:#fff}
.tabs{display:flex;gap:8px}
.tabs button{border:1.5px solid #b9cde1;background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--navy);font-size:15px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.big-score{font-size:76px;font-weight:900;color:var(--navy);line-height:1}
.pulse-anim circle{animation:none}
.say{display:flex;gap:12px;align-items:flex-start}
.say img{width:64px;height:64px;border-radius:50%;border:3px solid var(--cyan);flex:none;object-fit:cover}
.say .bubble{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:10px 14px;font-size:15.5px;line-height:1.45;position:relative}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#b0bec5}
.dots i.on{background:var(--biru)}
#print{display:none}
@media print{
  body{background:#fff;overflow:visible}
  #stage,#rotate-hint{display:none!important}
  #print{display:block;font:14px var(--font);color:#000;padding:20px}
  #print table{border-collapse:collapse;width:100%}
  #print td,#print th{border:1px solid #999;padding:6px;text-align:left}
}
/* ---------- Splash ---------- */
#splash{position:absolute;inset:0;z-index:80;display:none;color:#fff;overflow:hidden;background:radial-gradient(900px 620px at 72% 45%,#163b74 0%,#0b1e3f 52%,#040b18 100%)}
#splash.show{display:block}
#splash.out{opacity:0;transition:opacity .45s ease;pointer-events:none}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,194,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,194,255,.07) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 60% 50%,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at 60% 50%,#000 30%,transparent 78%)}
.sp-fiber{position:absolute;inset:0;width:100%;height:100%}
.sp-fiber path{fill:none;stroke-linecap:round}
.sp-fiber .pulse{stroke-dasharray:40 700;animation:spFlow 2.4s linear infinite}
@keyframes spFlow{from{stroke-dashoffset:740}to{stroke-dashoffset:0}}
.sp-left{position:absolute;left:78px;top:132px;width:540px}
.sp-title{font-size:66px;line-height:1.02;margin:16px 0 12px;font-weight:900;font-style:italic;letter-spacing:-.5px;background:linear-gradient(180deg,#fff 30%,#9fe8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tag{font-size:20px;line-height:1.4;color:#cfe6ff;margin:0}
.sp-btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.sp-btns .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}
.sp-hint{font-size:14px;color:#8fb3d9;margin-top:14px}
.sp-hint kbd{display:inline-block;min-width:24px;padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:600 12px var(--font);text-align:center}
.sp-load{margin-top:26px;width:420px}
.sp-load .t{display:flex;justify-content:space-between;font-size:13px;color:#9fc3e8;margin-bottom:6px}
.sp-load .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#7cf0ff);animation:spBar 3.3s ease-out forwards}
@keyframes spBar{to{width:100%}}
.sp-dev{position:absolute;left:668px;top:118px;width:540px;height:380px;border-radius:34px;background:linear-gradient(180deg,#ff9b32 0%,#e86a00 100%);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 -6px 0 rgba(0,0,0,.18)}
.sp-dev .handle{position:absolute;left:90px;right:170px;top:-16px;height:26px;border-radius:14px 14px 0 0;background:#2a323b}
.sp-dev .bezel{position:absolute;left:18px;top:18px;right:92px;bottom:18px;border-radius:20px;background:#1b232c;padding:12px}
.sp-dev .scr{position:relative;width:100%;height:100%;border-radius:12px;background:#061127;overflow:hidden;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace}
.sp-dev .side{position:absolute;right:22px;top:34px;display:flex;flex-direction:column;gap:14px;align-items:center}
.sp-dev .side i{width:44px;height:30px;border-radius:9px;background:#2a323b;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.sp-dev .side i.led{width:14px;height:14px;border-radius:50%;background:#69f0ae;box-shadow:0 0 12px #69f0ae;animation:spBlink 1.2s steps(2) infinite}
.sp-dev .side i.round{width:46px;height:46px;border-radius:50%;background:#1565C0}
@keyframes spBlink{50%{opacity:.25}}
.sp-dev .port{position:absolute;left:-14px;bottom:62px;width:22px;height:34px;border-radius:6px;background:#2a323b}
.sp-log{position:absolute;left:14px;top:12px;right:14px;font-size:13.5px;line-height:1.62;color:#9fe8ff}
.sp-log div{opacity:0;animation:spIn .25s ease forwards;white-space:pre}
.sp-log b{color:#69f0ae;font-weight:700}
.sp-ready{position:absolute;right:14px;top:12px;font-size:13px;font-weight:800;letter-spacing:1px;color:#69f0ae;opacity:0;animation:spIn .3s 3.3s forwards}
.sp-plot{position:absolute;left:8px;right:8px;bottom:8px;opacity:0;animation:spIn .35s 1.85s forwards}
.sp-plot .plot-bg{fill:#081631}
.sp-plot .plot .draw{animation-delay:2s;animation-duration:1.3s}
@keyframes spIn{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .sp-log div,.sp-plot,.sp-ready{opacity:1}
  .sp-load .bar i{width:100%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .plot .draw{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <header id="topbar"></header>
  <main id="view" aria-live="polite"></main>
  <div id="modal"></div>
  <div id="toast" role="status"></div>
  <div id="splash" role="dialog" aria-modal="true" aria-label="Layar pembuka Fiber Optic Fault Finder"></div>
</div></div>
<div id="rotate-hint">Putar perangkat ke posisi mendatar (landscape) agar tampilan lebih besar. <button type="button">Tutup</button></div>

const ENGINE = (() => {
  const PULSE = {
    10:   { w: 0.006, merge: 0.006, floor: -30, noise: x => (x > 3 ? Math.min(1.6, 0.15 + (x - 3) * 0.7) : 0.15), label: '10 ns' },
    100:  { w: 0.025, merge: 0.03,  floor: -37, noise: () => 0.07, label: '100 ns' },
    1000: { w: 0.15,  merge: 0.15,  floor: -42, noise: () => 0.03, label: '1 µs' }
  };
  const L0 = -15;
  const val = (v, lam) => (v && typeof v === 'object' ? v[lam] : v);
  const h = refl => Math.min(14, 4 + ((refl == null ? -50 : refl) + 50) * 0.28);
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

  function linkFor(mods, lam) {
    const LK = DATA.link;
    let evs = LK.events.map(e => Object.assign({}, e));
    let segs = [];
    (Array.isArray(mods) ? mods : [mods]).forEach(m => {
      if (!m) return;
      if (m.set) Object.keys(m.set).forEach(id => { const e = evs.find(x => x.id === id); if (e) Object.assign(e, m.set[id]); });
      if (m.remove) evs = evs.filter(e => m.remove.indexOf(e.id) < 0);
      if (m.add) m.add.forEach(a => evs.push(Object.assign({}, a)));
      if (m.cutAt != null) {
        evs = evs.filter(e => e.km < m.cutAt - 1e-9);
        evs.push({ id: 'cut', km: m.cutAt, type: 'E', refl: -14, name: 'Ujung serat (putus)' });
      }
      if (m.seg) segs.push(Object.assign({}, m.seg));
    });
    evs.sort((a, b) => a.km - b.km);
    evs = evs.map(e => Object.assign({}, e, { loss: e.type === 'E' ? 0 : (val(e.loss, lam) || 0) }));
    segs = segs.map(s => ({ a: s.a, b: s.b, att: val(s.att, lam) }));
    return { evs, segs, att: LK.att[lam] };
  }

  function mergeEvents(evs, gap) {
    const out = [];
    evs.forEach(e => {
      const p = out[out.length - 1];
      if (p && p.type !== 'E' && e.km - p.km < gap) {
        p.loss += e.loss;
        p.merged = (p.merged || [p.name]).concat(e.name);
        if (e.type === 'E') { p.type = 'E'; p.refl = e.refl; }
        else if (e.type === 'R') { p.type = 'R'; p.refl = Math.max(p.refl == null ? -99 : p.refl, e.refl); }
      } else out.push(Object.assign({}, e));
    });
    return out;
  }

  function build(mods, o) {
    const lam = o.lambda, P = PULSE[o.pulse], range = o.range;
    const shift = o.comp === false ? DATA.link.launch : 0;
    const lk = linkFor(mods, lam);
    const evs = mergeEvents(lk.evs, P.merge);
    const attAt = x => { for (const s of lk.segs) if (x >= s.a && x < s.b) return s.att; return lk.att; };
    const fiberLoss = (a, b) => {
      if (b <= a) return 0;
      const cuts = [];
      lk.segs.forEach(s => { [s.a, s.b].forEach(v => { if (v > a && v < b) cuts.push(v); }); });
      cuts.sort((p, q) => p - q);
      let sum = 0, prev = a;
      cuts.concat([b]).forEach(p => { sum += attAt((prev + p) / 2) * (p - prev); prev = p; });
      return sum;
    };
    const endEv = evs.find(e => e.type === 'E');
    const endKm = endEv ? endEv.km : 99;
    const levelBefore = km => L0 - fiberLoss(0, km) - evs.filter(e => e.type !== 'E' && e.km < km - 1e-9).reduce((s, e) => s + e.loss, 0);
    const base = x => L0 - fiberLoss(0, x) - evs.reduce((s, e) => (e.type === 'E' ? s : s + e.loss * Math.max(0, Math.min(1, (x - e.km) / P.w))), 0);
    const yClean = x => {
      if (x >= endKm) {
        const pk = levelBefore(endKm) + h(endEv.refl);
        const t = (x - endKm) / (P.w * 1.2);
        return t < 1 ? pk + (P.floor - pk) * t : P.floor;
      }
      let y = base(x);
      evs.forEach(e => {
        if (e.type === 'R' && x >= e.km && x <= e.km + P.w * 1.5) {
          const pk = levelBefore(e.km) + h(e.refl);
          const after = base(e.km + P.w * 1.5);
          const t = (x - e.km) / (P.w * 1.5);
          y = Math.max(y, pk + (after - pk) * t);
        }
      });
      return y;
    };

    const R = rng(o.seed || 7);
    let xs = [];
    const dx = Math.max(0.004, Math.min(range, endKm + 1) / 520);
    for (let x = 0; x <= Math.min(endKm, range); x += dx) xs.push(x);
    evs.forEach(e => { [0, 0.0012, P.w * 0.5, P.w, P.w * 1.5, P.w * 1.2].forEach(d => xs.push(e.km + d)); if (e.km > 0) xs.push(e.km - 0.0005); });
    lk.segs.forEach(s => xs.push(s.a, s.b));
    const tailEnd = Math.max(endKm + P.w * 1.3, range - shift);
    const dn = Math.max(0.02, range / 420);
    for (let x = endKm + P.w * 1.3; x <= tailEnd; x += dn) xs.push(x);
    xs = xs.filter(x => x >= 0 && x <= tailEnd).sort((a, b) => a - b);
    const uniq = [];
    xs.forEach(x => { if (!uniq.length || x - uniq[uniq.length - 1] > 0.0004) uniq.push(x); });

    const pts = [];
    if (shift > 0) {
      const topY = L0 + lk.att * shift;
      const dz = Math.max(0.06, P.w * 3);
      for (let x = 0; x < shift; x += Math.max(0.004, shift / 60)) {
        let y = L0 + lk.att * (shift - x);
        if (x < dz) y = Math.max(y, topY + 13 - (13 * x) / dz);
        pts.push([x, y + (R() - 0.5) * 2 * P.noise(0)]);
      }
    }
    uniq.forEach(x => {
      let y = yClean(x);
      if (x > endKm + P.w * 1.2) y = P.floor + (R() - 0.5) * 2.2 + (R() - 0.5) * 0.9;
      else y += (R() - 0.5) * 2 * P.noise(x);
      pts.push([x + shift, Math.max(-44.5, Math.min(-0.3, y))]);
    });
    const vis = pts.filter(p => p[0] <= range + 1e-9);

    const B = DATA.batas;
    const rows = evs.map(e => {
      const km = e.km + shift;
      let tipe, ok, info = false;
      if (e.type === 'R') { tipe = 'Reflektif'; ok = e.loss <= B.konektor + 1e-9 && e.refl <= B.reflektansi; }
      else if (e.type === 'N') { tipe = 'Non-reflektif'; ok = e.loss <= B.sambungan + 1e-9; }
      else {
        tipe = 'Ujung serat';
        ok = e.km >= DATA.link.panjang - 0.01;
        info = ok;
      }
      return { km, tipe, type: e.type, loss: e.type === 'E' ? null : e.loss, refl: (e.type === 'R' || e.type === 'E') ? e.refl : null,
        ok, info, name: e.merged ? e.merged.join(' + ') : e.name, merged: !!e.merged, visible: km <= range + 1e-9 };
    });
    lk.segs.forEach(s => rows.push({ km: s.a + shift, kmB: s.b + shift, tipe: 'Segmen', type: 'S', loss: s.att, refl: null,
      ok: s.att <= B.serat, name: 'Redaman serat', visible: s.a + shift <= range }));
    rows.sort((a, b) => a.km - b.km);

    const toKm = Math.min(DATA.link.panjang, endKm);
    const total = fiberLoss(0, toKm) + evs.filter(e => e.type !== 'E' && e.km <= toKm + 1e-9).reduce((s, e) => s + e.loss, 0);
    return {
      pts: vis, rows, segs: lk.segs.map(s => ({ a: s.a + shift, b: s.b + shift, att: s.att })), shift,
      endKm: endKm + shift, truncated: endKm + shift > range - 0.05, total, cut: endKm < DATA.link.panjang - 0.01,
      ok: rows.every(r => r.ok || r.info), lambda: lam, range, pulse: o.pulse, comp: o.comp !== false
    };
  }

  function yAt(pts, km) {
    if (!pts.length) return null;
    if (km <= pts[0][0]) return pts[0][1];
    let lo = 0, hi = pts.length - 1;
    if (km >= pts[hi][0]) return pts[hi][1];
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] <= km) lo = mid; else hi = mid; }
    const a = pts[lo], b = pts[hi];
    return a[1] + (b[1] - a[1]) * ((km - a[0]) / (b[0] - a[0] || 1));
  }

  function tickStep(range) { return range <= 2 ? 0.5 : range <= 10 ? 1 : range <= 20 ? 2 : 5; }

  /* Plot SVG. o = {w,h,range,traces:[{pts,color,width,opacity,anim}], bands, markers, hot, cursor, mini, id} */
  function plot(o) {
    const mini = !!o.mini;
    const m = mini ? { l: 6, r: 6, t: 6, b: 6 } : { l: 52, r: 16, t: 14, b: 38 };
    const W = o.w, H = o.h, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const yMin = o.yMin != null ? o.yMin : -45, yMax = 0;
    const X = km => m.l + (km / o.range) * pw;
    const Y = db => m.t + ((yMax - db) / (yMax - yMin)) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="plot${mini ? ' mini' : ''}" data-l="${m.l}" data-pw="${pw}" data-range="${o.range}" data-w="${W}" role="img" aria-label="${o.label || 'Grafik trace OTDR'}">`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" rx="${mini ? 8 : 10}" class="plot-bg"/>`;
    if (!mini) {
      for (let d = 0; d >= yMin; d -= 5) {
        s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(d)}" y2="${Y(d)}" class="grid${d % 10 === 0 ? '' : ' minor'}"/>`;
        if (d % 10 === 0) s += `<text x="${m.l - 8}" y="${Y(d) + 4}" text-anchor="end" class="tick">${d === 0 ? '0' : '−' + Math.abs(d)}</text>`;
      }
      const st = tickStep(o.range);
      for (let k = 0; k <= o.range + 1e-9; k += st) {
        s += `<line x1="${X(k)}" x2="${X(k)}" y1="${m.t}" y2="${m.t + ph}" class="grid minor"/>`;
        s += `<text x="${X(k)}" y="${m.t + ph + 18}" text-anchor="middle" class="tick">${fmt(k, st < 1 ? 1 : 0)}</text>`;
      }
      s += `<text x="${m.l + pw}" y="${H - 4}" text-anchor="end" class="axis-label">Jarak (km)</text>`;
      s += `<text x="12" y="${m.t + ph / 2}" transform="rotate(-90 12 ${m.t + ph / 2})" text-anchor="middle" class="axis-label">Daya (dB)</text>`;
    } else {
      for (let d = -10; d >= yMin; d -= 10) s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(d)}" y2="${Y(d)}" class="grid minor"/>`;
    }
    (o.bands || []).forEach(b => {
      const a = Math.max(0, b.a), z = Math.min(o.range, b.b);
      if (z > a) s += `<rect x="${X(a)}" y="${m.t}" width="${X(z) - X(a)}" height="${ph}" class="band ${b.cls || ''}"/>`;
    });
    (o.traces || []).forEach(t => {
      if (!t.pts.length) return;
      const d = 'M' + t.pts.map(p => X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('L');
      s += `<path d="${d}" pathLength="1000" fill="none" stroke="${t.color || '#FFD54F'}" stroke-width="${t.width || 2}" stroke-linejoin="round" opacity="${t.opacity || 1}" class="${t.anim ? 'draw' : ''}"/>`;
    });
    (o.markers || []).forEach(mk => {
      if (mk.km > o.range) return;
      s += `<g class="marker ${mk.cls || ''}"><line x1="${X(mk.km)}" x2="${X(mk.km)}" y1="${m.t}" y2="${m.t + ph}"/>`;
      if (mk.label && !mini) s += `<text x="${X(mk.km) + 5}" y="${m.t + 16 + (mk.row || 0) * 16}">${mk.label}</text>`;
      s += `</g>`;
    });
    (o.hot || []).forEach(hs => {
      if (hs.km > o.range) return;
      s += `<g class="hotspot" data-hot="${hs.n}" tabindex="0" role="button" aria-label="Bantuan ${hs.n}"><circle cx="${X(hs.km)}" cy="${Y(hs.db)}" r="13"/><text x="${X(hs.km)}" y="${Y(hs.db) + 5}" text-anchor="middle">${hs.n}</text></g>`;
    });
    if (o.cursor != null && !mini) {
      s += `<g class="cursor" transform="translate(${X(o.cursor)} 0)"><line x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}"/><rect x="-9" y="${m.t - 2}" width="18" height="14" rx="4"/><text x="0" y="${m.t + 9}" text-anchor="middle">A</text></g>`;
      s += `<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" class="plot-hit"/>`;
    }
    s += `</svg>`;
    return s;
  }

  /* Menghubungkan kursor ke plot: drag/ketuk dan tombol panah */
  function bindCursor(holder, range, onMove) {
    const svg = holder.querySelector('svg.plot');
    if (!svg) return;
    const l = +svg.dataset.l, pw = +svg.dataset.pw, W = +svg.dataset.w;
    const cur = svg.querySelector('.cursor');
    const hit = svg.querySelector('.plot-hit');
    if (!cur || !hit) return;
    let km = holder._km != null ? holder._km : 0;
    const set = v => {
      km = Math.max(0, Math.min(range, Math.round(v * 1000) / 1000));
      holder._km = km;
      cur.setAttribute('transform', `translate(${l + (km / range) * pw} 0)`);
      onMove(km);
    };
    const fromEvent = ev => {
      const r = svg.getBoundingClientRect();
      const x = ((ev.clientX - r.left) / r.width) * W;
      set(((x - l) / pw) * range);
    };
    let down = false;
    hit.addEventListener('pointerdown', ev => { down = true; try { hit.setPointerCapture(ev.pointerId); } catch (e) {} fromEvent(ev); });
    hit.addEventListener('pointermove', ev => { if (down) fromEvent(ev); });
    hit.addEventListener('pointerup', () => { down = false; });
    hit.addEventListener('pointercancel', () => { down = false; });
    holder.setAttribute('tabindex', '0');
    holder.addEventListener('keydown', ev => {
      const step = ev.shiftKey ? 0.1 : 0.01;
      if (ev.key === 'ArrowRight') { set(km + step); ev.preventDefault(); }
      if (ev.key === 'ArrowLeft') { set(km - step); ev.preventDefault(); }
    });
    set(km);
    return set;
  }

  function fmt(v, d) { return (Math.round(v * Math.pow(10, d) + 1e-6) / Math.pow(10, d)).toFixed(d).replace('.', ','); }

  return { build, plot, bindCursor, yAt, fmt, linkFor, PULSE };
})();

  const kasus = cases.reduce((a, b) => a + b.s, 0);
  const kuis = S.quizBest * 3;
  const bonus = Object.keys(S.misi).reduce((a, k) => a + S.misi[k].best, 0);

    .concat(Object.keys(S.cases).map(k => S.cases[k].done)).concat([!!(S.quiz && S.quiz.finished), !!S.reflSaved]);

/* ---------- Suara (Web Audio, tanpa file) ---------- */
const Sound = {
  ctx: null,
  getCtx() {
    try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  beep(f, d, type, vol) {
    if (!S.sound) return;
    try {
      const ac = this.getCtx(); if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(vol || 0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (d || 0.12));
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + (d || 0.12) + 0.02);
    } catch (e) {}
  },
  ok() { this.beep(660, 0.1); setTimeout(() => this.beep(990, 0.16), 110); },
  bad() { this.beep(200, 0.25, 'square', 0.055); },
  click() { this.beep(1150, 0.04, 'sine', 0.04); },
  otdr() { this.beep(1600, 0.07, 'square', 0.035); }
};

/* ---------- Musik latar: komposisi orisinal, dibangkitkan Web Audio API ----------
   90 BPM, A minor, 4 akor berulang (Am7 – Fmaj7 – Cmaj7 – Gadd9): pad lembut, arpeggio,
   bass, hi-hat halus, dan "ping" pulsa OTDR setiap dua birama. Volume diatur di MUSIK.vol. */
const MUSIK = {
  vol: 1.0, bpm: 90,
  chords: [
    { bass: 57, pad: [57, 60, 64, 67], arp: [69, 72, 76, 79] },
    { bass: 53, pad: [53, 57, 60, 64], arp: [65, 69, 72, 76] },
    { bass: 48, pad: [55, 60, 64, 71], arp: [72, 76, 79, 83] },
    { bass: 55, pad: [55, 59, 62, 69], arp: [67, 71, 74, 79] }
  ],
  pola: [[0, 1, 2, 3, 2, 1, 2, 3], [0, 2, 1, 3, 0, 2, 3, 1], [3, 2, 1, 0, 1, 2, 1, 0], [0, 1, 2, 1, 3, 2, 1, 2]]
};
const Music = {
  on: false, timer: null, next: 0, step: 0, master: null,
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  build(ac) {
    this.master = ac.createGain(); this.master.gain.value = 0;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
    this.master.connect(comp); comp.connect(ac.destination);
    this.delay = ac.createDelay(1.5); this.delay.delayTime.value = 60 / MUSIK.bpm * 0.75;
    const fb = ac.createGain(); fb.gain.value = 0.33;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2400;
    this.delay.connect(tone); tone.connect(fb); fb.connect(this.delay); tone.connect(this.master);
    this.send = ac.createGain(); this.send.gain.value = 0.55; this.send.connect(this.delay);
    this.padBus = ac.createBiquadFilter(); this.padBus.type = 'lowpass'; this.padBus.frequency.value = 1500; this.padBus.Q.value = 0.6; this.padBus.connect(this.master);
    const len = Math.floor(ac.sampleRate * 0.25); this.noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noise.getChannelData(0); let s = 12345;
    for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
  },
  start() {
    if (this.on || S.music === false) return;
    const ac = Sound.getCtx(); if (!ac) return;
    if (!this.master) this.build(ac);
    this.on = true;
    const t = ac.currentTime;
    this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value, t); this.master.gain.linearRampToValueAtTime(MUSIK.vol, t + 3);
    this.next = t + 0.12; this.step = 0;
    clearInterval(this.timer); this.timer = setInterval(() => this.schedule(), 90);
  },
  stop() {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer); this.timer = null;
    const ac = Sound.ctx; if (!ac || !this.master) return;
    const t = ac.currentTime;
    this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value, t); this.master.gain.linearRampToValueAtTime(0, t + 0.6);
  },
  schedule() {
    const ac = Sound.ctx; if (!ac || !this.on) return;
    const sx = 60 / MUSIK.bpm / 4;
    while (this.next < ac.currentTime + 0.3) { this.playStep(this.step, this.next, sx); this.next += sx; this.step++; }
  },
  playStep(s, t, sx) {
    const ac = Sound.ctx, bar = Math.floor(s / 16), st = s % 16, loop = Math.floor(s / 64);
    const ch = MUSIK.chords[bar % 4];
    if (st === 0) { this.pad(ac, ch.pad, t, sx * 16); this.bass(ac, ch.bass, t, 0.045); }
    if (st === 10) this.bass(ac, ch.bass, t, 0.03);
    if (st % 2 === 0 && !(loop === 0 && bar < 1)) {
      const p = MUSIK.pola[loop % MUSIK.pola.length], n = ch.arp[p[st / 2]];
      this.pluck(ac, n, t, st % 8 === 0 ? 0.055 : 0.038);
    }
    if (loop > 0 && st % 4 === 2) this.hat(ac, t, st === 14 ? 0.012 : 0.008);
    if (loop > 0 && (st === 0 || st === 8)) this.kick(ac, t, st === 0 ? 0.05 : 0.035);
    if (st === 0 && bar % 2 === 0) this.ping(ac, t + sx * 2);
  },
  env(ac, g, t, a, peak, dur, rel) {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + Math.max(a, dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  pad(ac, notes, t, dur) {
    notes.forEach(m => [-6, 6].forEach(c => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = this.mtof(m); o.detune.value = c;
      this.env(ac, g, t, 0.9, 0.015, dur + 0.6, 0.9); o.connect(g); g.connect(this.padBus); o.start(t); o.stop(t + dur + 0.7);
    }));
  },
  pluck(ac, m, t, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = this.mtof(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(g); g.connect(this.master); g.connect(this.send); o.start(t); o.stop(t + 0.42);
  },
  bass(ac, m, t, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = this.mtof(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 1.35);
  },
  kick(ac, t, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.16);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.3);
  },
  hat(ac, t, v) {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = this.noise; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(v * 1.8, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    n.connect(f); f.connect(g); g.connect(this.master); n.start(t); n.stop(t + 0.06);
  },
  ping(ac, t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(1760, t); o.frequency.exponentialRampToValueAtTime(1660, t + 0.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.022, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(this.master); g.connect(this.send); o.start(t); o.stop(t + 0.75);
  }
};

  const r = seed ? (() => { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; })() : Math.random;
  const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b;
}

  render(v) {

    const slotHtml = s => {

        ${it ? imgTag(items[it].img, items[it].nama) + `<span>${items[it].nama}</span>` : `${ICON.target.replace('<svg', '<svg width="30" height="30"')}<span>${s.label}</span>`}</div>`;
    };
    const lit = R.done;
    v.innerHTML = `<div class="screen">
      <h2 class="title">Rangkai Alat Uji <small>Seret komponen ke slot yang tepat, atau ketuk komponen lalu ketuk slotnya</small></h2>
      <div class="screen-main" style="flex-direction:column;margin-top:10px;gap:12px">
        <div class="chain">
          ${slotHtml(slots[0])}<div class="wire ${lit ? 'lit' : ''}"></div>${slotHtml(slots[1])}<div class="wire ${lit ? 'lit' : ''}"></div>
          <div style="width:430px;flex:none;background:rgba(255,255,255,.04);border:1.5px solid #2c4c7c;border-radius:14px;padding:10px 12px;color:#cfe6ff">
            <div class="small" style="color:#9fe8ff;font-weight:700">LINK UJI · 5,00 km (terpasang)</div>
            <svg viewBox="0 0 400 92" style="width:100%" aria-label="Jalur uji dengan ODF awal, ODF perantara, joint closure, dan ODF ujung">

              ${[[10, 'ODF awal', '0 km', 'start'], [101, 'ODF perantara', '1,20 km', 'middle'], [170, 'Joint closure', '2,00 km', 'middle'], [390, 'ODF ujung', '5,00 km', 'end']].map(([x, n, k, an], i) => `
                <g><rect x="${x - (i === 2 ? 12 : 9)}" y="${i === 2 ? 36 : 34}" width="${i === 2 ? 24 : 18}" height="${i === 2 ? 20 : 24}" rx="${i === 2 ? 10 : 3}" fill="${i === 2 ? '#78909c' : '#1e88e5'}"/>
                <text x="${x}" y="${i % 2 ? 14 : 76}" text-anchor="${an}" fill="#cfe6ff" font-size="12">${n}</text>
                <text x="${x}" y="${i % 2 ? 27 : 89}" text-anchor="${an}" fill="#8fb3d9" font-size="11">${k}</text></g>`).join('')}
            </svg></div>
          <div class="wire ${lit ? 'lit' : ''}"></div>${slotHtml(slots[2])}
        </div>
        <div class="row" style="gap:16px;align-items:stretch;flex:1;min-height:0">
          <div class="col" style="flex:1">
            <div class="label" style="margin-top:0">Baki komponen</div>
            <div class="tray">${Object.keys(items).map(k => { const used = Object.values(R.placed).indexOf(k) >= 0; return `<div class="item ${used ? 'used' : ''} ${window.__armed === k ? 'sel' : ''}" data-item="${k}" role="button" tabindex="0" aria-label="${items[k].nama}">${imgTag(items[k].img, items[k].nama)}<span>${items[k].nama}</span></div>`; }).join('')}</div>
          </div>
          <div class="card" style="width:430px;flex:none" id="rfb">${R.done ? deadzoneHtml() : `<b style="color:var(--navy)">Petunjuk</b><p style="margin-top:6px">Urutan rangkaian uji OTDR: <b>OTDR → launch cable → link uji → receive cable</b>. Satu komponen di baki bukan bagian dari rangkaian ini.</p><p class="small muted">Kesalahan: ${R.errors}</p>`}</div>
        </div>
      </div>
      ${foot({ back: 'L04', next: 'L06', nextLabel: 'Ke Papan Tiket', nextDisabled: !R.done, ai: true })}
    </div>`;
    const tryPlace = (item, slot) => {
      window.__armed = null;
      if (R.placed[slot]) { toast('Slot ini sudah terisi.'); render(); return; }
      if (item === slot) {
        R.placed[slot] = item; Sound.ok();
        if (Object.keys(R.placed).length === 3) { R.done = true; Sound.ok(); }
        save(); render();
      } else {
        R.errors++; Sound.bad(); save(); render();
        let msg = 'Komponen ini belum tepat untuk slot tersebut.';
        if (item === 'utp') msg = 'Kabel UTP menghantarkan sinyal listrik, bukan cahaya. Jalur ini butuh kabel fiber.';
        else if (item === 'receive' && slot !== 'receive') msg = 'Receive cable dipasang di ujung jalur, bukan di dekat OTDR.';
        else if (item === 'launch' && slot === 'receive') msg = 'Launch cable dipasang langsung setelah OTDR untuk mengatasi dead zone.';
        else if (item === 'otdr') msg = 'OTDR adalah alat ukur, letaknya di paling awal rangkaian.';
        else if (slot === 'otdr') msg = 'Slot paling awal adalah tempat alat ukurnya, yaitu OTDR.';
        $('#rfb').innerHTML = `<div class="fb bad"><b>Belum tepat</b>${msg}</div><p class="small muted" style="margin-top:8px">Kesalahan: ${R.errors}</p>`;
      }
    };
    $$('.tray .item', v).forEach(el => {
      const k = el.dataset.item;
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { window.__armed = k; render(); e.preventDefault(); } });
      el.addEventListener('pointerdown', e => {
        if (el.classList.contains('used')) return;
        e.preventDefault();
        const sc = window.__scale || 1, r = el.getBoundingClientRect();
        const ghost = el.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.style.width = el.offsetWidth + 'px'; ghost.style.height = el.offsetHeight + 'px';
        ghost.style.transform = `scale(${sc})`; document.body.appendChild(ghost);
        const ox = e.clientX - r.left, oy = e.clientY - r.top; let moved = false;
        const move = ev => { moved = moved || Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) > 6; ghost.style.left = (ev.clientX - ox) + 'px'; ghost.style.top = (ev.clientY - oy) + 'px';
          $$('.slot', v).forEach(s => s.classList.remove('hover')); const t = document.elementFromPoint(ev.clientX, ev.clientY); const s = t && t.closest('.slot'); if (s) s.classList.add('hover'); };
        const up = ev => {
          document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); ghost.remove();
          const t = document.elementFromPoint(ev.clientX, ev.clientY); const s = t && t.closest('.slot');
          if (moved && s) tryPlace(k, s.dataset.slot);
          else if (!moved) { window.__armed = window.__armed === k ? null : k; render(); }
          else render();
        };
        move(e); document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
      });
    });
    $$('.slot', v).forEach(s => {
      const act = () => { if (window.__armed) tryPlace(window.__armed, s.dataset.slot); else toast('Pilih (ketuk) komponen di baki dulu, lalu ketuk slot ini.'); };
      s.addEventListener('click', act);
      s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { act(); e.preventDefault(); } });
      if (window.__armed && !s.classList.contains('filled')) s.classList.add('armed');
    });
  }
};

/* =========================================================
   LAYAR SIMULASI L07–L11
   ========================================================= */
function noCase(v) {
  v.innerHTML = `<div class="screen"><div class="screen-main" style="align-items:center;justify-content:center;flex-direction:column">
    <h2 class="title">Belum ada tiket aktif</h2><p class="lead">Pilih satu kasus di papan tiket terlebih dahulu.</p>
    <button class="btn primary big" data-go="L06">${ICON.board} Buka Papan Tiket</button></div></div>`;
}
const LAMS = { 1310: '#FFD54F', 1550: '#4DD0E1' };
function traceOf(mods, p, lam) { return ENGINE.build(mods, { lambda: lam || p.lambda, range: p.range, pulse: p.pulse, comp: p.comp }); }
function expectedKm(d, shift) { return d.jawab.seg ? null : d.jawab.km + shift; }
function paramMsgs(p) {
  const out = [];
  if (p.range === 10 && p.pulse === 100) out.push(['ok', 'Pengaturan optimal untuk jalur 5 km!']);
  if (p.range === 2) out.push(['warn', 'Range 2 km lebih pendek dari jalur 5 km. Trace berhenti di 2 km dan ujung jalur tidak terlihat.']);
  else if (p.range === 5) out.push(['warn', 'Ujung jalur berada tepat di tepi layar. Pilih range yang lebih panjang.']);
  else if (p.range >= 20) out.push(['warn', 'Trace terlihat mampat di sisi kiri dan event kecil sulit dibaca. Coba range yang lebih pendek.']);
  if (p.pulse === 10) out.push(['warn', 'Pulsa sangat pendek: detail tajam, tapi trace mulai bergerigi (noise) di jarak jauh.']);
  else if (p.pulse === 1000) out.push(['warn', 'Pulsa panjang: trace halus, tapi dead zone melebar dan event berdekatan bisa menyatu.']);
  if (p.lambda === 1550) out.push(['info', '1550 nm: redaman serat lebih kecil (0,20 dB/km) dan lebih peka terhadap tikungan (bending).']);
  if (p.comp === false) out.push(['info', 'Kompensasi launch cable mati: semua jarak bergeser +0,50 km. Kurangi 0,50 km saat membaca lokasi.']);
  return out;
}
function segHtml(name, opts, cur, dark) {
  return `<div class="seg ${dark ? 'dark' : ''}" data-seg="${name}" role="group">${opts.map(o => `<button class="${String(o.v) === String(cur) ? 'on' : ''}" data-v="${o.v}" aria-pressed="${String(o.v) === String(cur)}">${o.t}</button>`).join('')}</div>`;
}
function bindSeg(v, cb) { $$('[data-seg]', v).forEach(g => $$('button', g).forEach(b => b.onclick = () => { Sound.click(); cb(g.dataset.seg, b.dataset.v); })); }
const OPT = {
  lambda: [{ v: 1310, t: '1310 nm' }, { v: 1550, t: '1550 nm' }],
  range: [{ v: 2, t: '2 km' }, { v: 5, t: '5 km' }, { v: 10, t: '10 km' }, { v: 20, t: '20 km' }, { v: 40, t: '40 km' }],
  pulse: [{ v: 10, t: '10 ns' }, { v: 100, t: '100 ns' }, { v: 1000, t: '1 µs' }]
};
function evTable(tr, lim) {
  const rows = tr.rows.filter(r => r.visible).slice(0, lim || 9);
  const tp = { 'Reflektif': 'Reflektif', 'Non-reflektif': 'Non-refl.', 'Ujung serat': 'Ujung', 'Segmen': 'Segmen' };
  return `<table class="ev"><thead><tr><th>Jarak (km)</th><th>Tipe</th><th>Loss (dB)</th><th>Refl. (dB)</th><th>Status</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.type === 'S' ? F(r.km) + '–' + F(r.kmB) : F(r.km)}</td><td>${tp[r.tipe] || r.tipe}${r.merged ? '*' : ''}</td>
      <td>${r.loss == null ? '—' : r.type === 'S' ? F(r.loss) + '/km' : F(r.loss)}</td>
      <td>${r.refl == null ? '—' : r.refl}</td>
      <td><span class="dot" style="background:${r.ok ? (r.info ? '#90caf9' : '#66bb6a') : '#ef5350'}"></span>${r.ok ? (r.info ? 'Ujung' : 'Lulus') : 'Gagal'}</td></tr>`).join('')}
  </tbody></table>${rows.some(r => r.merged) ? '<div class="small" style="color:#8fb3d9">* beberapa event menyatu karena pulse width</div>' : ''}`;
}
function summaryLine(tr) {
  return `Total loss jalur 0–5 km: <b>${F(tr.total)} dB</b> · ${tr.cut ? `<b style="color:#ff8a80">serat berakhir di ${F(tr.endKm)} km</b>` : `panjang terukur ${F(tr.endKm)} km (termasuk receive cable)`}`;
}

      const ok = d.jawab.seg ? (km >= d.jawab.seg[0] + sh - tol && km <= d.jawab.seg[1] + sh + tol) : Math.abs(km - exp) <= tol;
      if (ok) {

/* ---------- L09 Diagnosis ---------- */
function rowAt(tr, d) {
  if (d.jawab.seg) return tr.rows.find(r => r.type === 'S');
  const exp = d.jawab.km + tr.shift;
  return tr.rows.filter(r => r.type !== 'S').sort((a, b) => Math.abs(a.km - exp) - Math.abs(b.km - exp))[0];
}

            <button class="btn blue" id="btnPrint">${ICON.print} Cetak Ringkasan</button>
            <button class="btn ghost" id="copy">${ICON.copy} Salin Ringkasan</button>
            ${ulang.length ? `<button class="btn purple" data-go="L06">${ICON.refresh} Ulangi kasus: ${ulang.join(', ')}</button>` : ''}
            <button class="btn ghost" id="reset">${ICON.refresh} Reset semua</button>
          </div>
        </div>
      </div>
      ${foot({ back: 'L15', backLabel: 'Tantangan', next: 'L17', nextLabel: 'Informasi Kreator' })}
    </div>`;
    $('#btnPrint', v).onclick = () => {
      $('#print').innerHTML = `<h2>${DATA.config.judul}</h2><p>${DATA.config.sub}</p><pre style="font:14px var(--font);white-space:pre-wrap">${esc(summaryText())}</pre><p>Dicetak: ${new Date().toLocaleString('id-ID')}</p>`;
      try { window.print(); } catch (e) { toast('Cetak tidak tersedia di tampilan ini. Gunakan Salin Ringkasan.'); }
    };
    $('#copy', v).onclick = () => {
      const t = summaryText();
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? 'Ringkasan disalin.' : 'Tidak bisa menyalin otomatis di tampilan ini.'); };
      try { navigator.clipboard.writeText(t).then(() => toast('Ringkasan disalin.'), fallback); } catch (e) { fallback(); }
    };
    $('#reset', v).onclick = () => modal('Reset semua progres?', '<p>Semua skor, kasus, kuis, dan tantangan akan dihapus dari perangkat ini.</p>',
      [{ label: 'Batal' }, { label: 'Ya, reset', cls: 'red', fn: () => { Store.clear(); S = freshState(); save(); go('L01'); toast('Progres sudah direset.'); } }]);
  }
};

/* ---------- L17 Informasi Kreator ---------- */
SCREENS.L17 = {
  title: 'Informasi Kreator dan Sumber',
  render(v) {
    v.innerHTML = `<div class="screen">
      <div class="screen-main">
        <div class="card col" style="width:440px;flex:none;gap:8px">
          <span class="badge">Informasi Kreator</span>
          <div class="row" style="gap:12px;margin-top:6px"><span style="width:58px;height:58px;border-radius:50%;background:#e3f2fd;color:var(--biru);display:grid;place-items:center">${ICON.user.replace('<svg', '<svg width="32" height="32"')}</span>
            <div><b style="font-size:20px;color:var(--navy)">${DATA.config.kreator}</b><div class="muted">${DATA.config.sekolah}</div></div></div>
          <table class="ev light" style="margin-top:10px"><tbody>
            <tr><td>Judul</td><td>${DATA.config.judul}</td></tr><tr><td>Kategori</td><td>Laboratorium Maya</td></tr>
            <tr><td>Sasaran</td><td>Fase F, Teknik Komputer dan Jaringan</td></tr><tr><td>Versi</td><td>${DATA.config.versi}</td></tr></tbody></table>
        </div>
        <div class="card col" style="flex:1;gap:6px;font-size:15px">
          <b style="color:var(--navy);font-size:18px">Sumber aset dan rujukan</b>
          <ul style="margin:0;padding-left:20px;line-height:1.55">
            <li>Ilustrasi alat (OTDR, gulungan kabel, launch cable, konektor, fusion splicer, cleaning kit, inspection scope, stripper), karakter Kak Raka, dan ilustrasi gangguan: <b>gambar ini dibuat oleh AI</b>, disiapkan dan disunting oleh kreator.</li>
            <li>Grafik trace OTDR, diagram jalur, ikon, lencana, dan animasi: dibuat oleh kreator dengan kode (SVG/CSS).</li>
            <li>Musik latar dan efek suara: komposisi orisinal kreator yang dibangkitkan Web Audio API, tanpa file atau rekaman audio.</li>
            <li>Data trace adalah simulasi pembelajaran yang disederhanakan, bukan hasil ukur alat bermerek tertentu.</li>
            <li>Batas acuan: ANSI/TIA-568.3-D — loss konektor 0,75 dB, sambungan 0,3 dB, kabel single-mode outdoor 0,4 dB/km; reflektansi konektor UPC −40 dB.</li>
            <li>Petunjuk Teknis Pengembangan Bahan Ajar untuk Peningkatan Mutu Pembelajaran SMK, Direktorat SMK, 2026.</li>
            <li>Capaian Pembelajaran Fase F konsentrasi Teknik Komputer dan Jaringan, elemen Teknologi Jaringan Kabel dan Nirkabel.</li>
          </ul>
          <p class="small muted" style="margin-top:auto">Bahan ajar ini tidak memuat promosi produk dan tidak mengumpulkan data pribadi murid.</p>
        </div>
      </div>
      ${foot({ back: 'L16', backLabel: 'Hasil Akhir', next: 'L01', nextLabel: 'Kembali ke Laman Muka', nextCls: 'ghost' })}
    </div>`;
  }
};

/* ---------- Splash screen ---------- */
function showSplash() {
  const sp = $('#splash');
  const p = progress(), resume = p > 0 || (S.screen && S.screen !== 'L01');
  const tr = ENGINE.build({ cutAt: 3.0 }, { lambda: 1310, range: 6, pulse: 100, comp: true });
  const log = [['OTDR · uji mandiri dimulai', ''], ['Laser 1310 nm ........ ', 'OK'], ['Laser 1550 nm ........ ', 'OK'], ['Kalibrasi detektor ... ', 'OK'],
    ['Launch cable 500 m ... ', 'terpasang'], ['Jalur uji 5,00 km .... ', 'siap']];
  sp.innerHTML = `<div class="sp-grid"></div>
    <svg class="sp-fiber" viewBox="0 0 1280 720" preserveAspectRatio="none" aria-hidden="true">
      ${[0, 1, 2].map(i => `<path d="M654 ${414 + i * 5} C 560 ${430 + i * 8}, 520 ${640 + i * 6}, 240 ${648 + i * 8} S -40 ${600 + i * 10}, -60 ${610 + i * 10}" stroke="${['#FFD54F', '#00C2FF', '#7cf0ff'][i]}" stroke-opacity=".28" stroke-width="5"/>
        <path class="pulse" d="M-60 ${610 + i * 10} S 40 ${600 + i * 10}, 240 ${648 + i * 8} S 560 ${430 + i * 8}, 654 ${414 + i * 5}" stroke="${['#FFD54F', '#00C2FF', '#7cf0ff'][i]}" stroke-width="5" style="animation-delay:${i * 0.5}s"/>`).join('')}
    </svg>
    <div class="sp-left">
      <span class="hero-badge">${ICON.layers.replace('<svg', '<svg width="22" height="22"')} Lab Maya</span>
      <div class="sp-title">Fiber Optic<br>Fault Finder</div>
      <p class="sp-tag">${DATA.config.sub}</p>
      <div class="sp-btns">
        <button class="btn primary big" id="spGo">${ICON.play} ${resume ? 'Lanjutkan Belajar' : 'Masuk'}</button>
        <button class="btn ghost big" id="spFull">${ICON.full} Masuk Layar Penuh</button>
      </div>
      <div class="sp-hint">Tekan <kbd>Enter</kbd> <kbd>Spasi</kbd> atau <kbd>Esc</kbd> untuk masuk${p > 0 ? ` · progres tersimpan ${p}%` : ''}</div>
      <div class="sp-hint">${S.music !== false ? '♪ Musik latar diputar setelah masuk. Matikan lewat tombol ♪ di kanan atas.' : '♪ Musik latar sedang dimatikan. Nyalakan lewat tombol ♪ di kanan atas.'}</div>
      <div class="sp-load"><div class="t"><span id="spStat">Menyiapkan OTDR virtual…</span><span>16:9 · offline</span></div><div class="bar"><i></i></div></div>
    </div>
    <div class="sp-dev" aria-hidden="true">
      <div class="handle"></div><div class="port"></div>
      <div class="bezel"><div class="scr">
        <div class="sp-log">${log.map((l, i) => `<div style="animation-delay:${0.2 + i * 0.28}s">${l[0]}${l[1] ? `<b>${l[1]}</b>` : ''}</div>`).join('')}</div>
        <div class="sp-ready">● SIAP MENGUKUR</div>
        <div class="sp-plot">${ENGINE.plot({ w: 404, h: 140, range: 6, mini: true, traces: [{ pts: tr.pts, color: '#FFD54F', width: 2.5, anim: true }], markers: [{ km: 3.0 }] })}</div>
      </div></div>
      <div class="side"><i class="led"></i><i class="round"></i><i></i><i></i><i></i></div>
    </div>`;
  sp.classList.add('show');
  const key = e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); enter(false); } };
  const enter = full => {
    if (sp.classList.contains('out')) return;
    document.removeEventListener('keydown', key, true);
    Sound.ok(); Music.start();
    if (full) { try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => toast('Layar penuh tidak didukung di tampilan ini.')); } catch (e) {} }
    sp.classList.add('out');
    setTimeout(() => {
      sp.classList.remove('show', 'out'); sp.innerHTML = '';
      const h = $('#view h2, #view h1'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) {} }
    }, 460);
  };
  document.addEventListener('keydown', key, true);
  $('#spGo').onclick = () => enter(false);
  $('#spFull').onclick = () => enter(true);
  setTimeout(() => { const b = $('#spGo'); if (b) b.focus(); }, 60);
  setTimeout(() => { const st = $('#spStat'); if (st) st.textContent = 'OTDR siap · silakan masuk'; }, 3300);
}

/* ---------- Inisialisasi ---------- */
function boot() {
  fit();
  const h = (location.hash || '').slice(1);
  const start = SCREENS[h] ? h : (S.screen && SCREENS[S.screen] ? S.screen : 'L01');
  try { history.replaceState({ s: start }, '', '#' + start); } catch (e) {}
  S.screen = start; render();
  showSplash();
  const rc = $('#rotate-hint button'); if (rc) rc.onclick = () => { window.__hintClosed = true; fit(); };
}
boot();
</script>
</body>
</html>
